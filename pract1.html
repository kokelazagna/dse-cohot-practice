// TASK 2 - calculateTotal
// ============================================================
function calculateTotal(quantity, unitPrice) {
  if (typeof quantity !== "number" || typeof unitPrice !== "number") {
    return null;
  }
  if (!Number.isInteger(quantity) || quantity <= 0) {
    return null;
  }
  if (!Number.isInteger(unitPrice) || unitPrice < 0) {
    return null;
  }
  return quantity * unitPrice;
}

function getLowStockProducts(productList, threshold) {

// ============================================================
// TASK 4 - Debug and implement a sale
// ============================================================
// 1. Defects in the original sellProduct:
//    a) No check that the product exists. If find() returns undefined,
//       product.stock crashes with a TypeError.
//    b) No check that quantity is a positive whole number (0, -2, 2.5 and
//       "3" are all accepted).
//    c) Stock goes UP: product.stock += quantity should be -=.
//    d) Wrong return value: price + quantity should be price * quantity.
//    e) Failed sales return 0, but the requirements say return null
//       (0 is also confusing because it looks like a valid total).
 
function sellProduct(productList, productId, quantity) {
  const product = productList.find(item => item.id === productId);
 
  if (product === undefined) {
    return null; // product does not exist
  }
  if (typeof quantity !== "number" || !Number.isInteger(quantity) || quantity <= 0) {
    return null; // quantity must be a positive whole number
  }
  if (product.stock < quantity) {
    return null; // not enough stock; stock is left unchanged
  }
 
  product.stock -= quantity;
  return product.price * quantity;
}

  return productList.filter(item => item.stock <= threshold);
}
